name: hermes-ha-plugin
kind: platform
version: 0.1.2
description: >
  Home Assistant event bridge for Hermes Agent with configurable event
  triggers, prompts, HA media tools, and response sinks.
author: Andres Sade
requires_env:
  - HASS_TOKEN
provides_tools:
  - ha_list_events
  - ha_recent_events
  - ha_fetch_media
